            local log="/tmp/${label}-restore.log" expected="/tmp/${label}-expected.txt" observed="/tmp/${label}-exception.txt"
            local count_before count_after rc
            count_before=$(WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" BACKUP_OUT="$BACKUP_OUT" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" backup list | wc -l | tr -d '[:space:]')
