          mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT last_name FROM \`$DB_MAIN\`.cpmswp_cpms_patients WHERE mrn='SYN-CLOSURE-R1';" | grep -qx 'MUTATED-LastName'
