name: Closure Gate (GO-LIVE evidence closure)

# بستن شکاف‌های شواهد GO-LIVE که در sandbox قابل اجرا نبودند اما در CI
# (Ubuntu VM + MySQL 8 + PHP real) قابل اثبات‌اند:
#   A) runtime کامل PHP 8.1/8.3/8.4 (WordPress 7.1.3 واقعی)
#   B) restoreApply مخرب در محیط یک‌بارمصرف + ورودی‌های خراب/دستکاری‌شده
# هر job نتیجه را در کامنت PR (در دسترس بازبین) + artifact منتشر می‌کند.
# این فاز «بستن شواهد» است — بدون توسعه‌ی ویژگی؛ فقط محیط‌های یک‌بارمصرف.
#
# بازهٔ پشتیبانی‌شده: سه نسخهٔ اصلیِ پایدارِ آخر (۷.۱ / ۷.۰ / ۶.۹). این workflow
# فقط لِینِ اصلی روی آخرین نسخهٔ پایدار (۷.۱.۳) را اجرا می‌کند؛ probe قدیمیِ
# ۶.۴/۶.۵/۶.۶ (job سابقِ `compat-wp`) حذف شد چون این نسخه‌ها دیگر پشتیبانی
# نمی‌شوند. سازگاریِ دو نسخهٔ اصلیِ پیشین در workflow زمان‌بندی‌شدهٔ
# `.github/workflows/wp-compat.yml` سنجیده می‌شود تا تعداد چک‌های per-PR
# سه‌برابر نشود.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # PR runs are keyed by PR number; non-PR runs by their full ref. Event names
  # keep pull_request and push evidence in separate cancellation domains.
  # Main refs add the unique run ID so even a pending main run is never replaced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('main-run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  # Preserve every main-ref run as post-merge evidence; superseded non-main work may stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    working-directory: clinic-practice-management

env:
  GH_TOKEN: ${{ github.token }}
  CPMS_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  # ============================================================
  # A) PHP 8.1 / 8.3 / 8.4 — runtime کامل WordPress 7.1.3
  # ============================================================
  runtime-php:
    name: Closure — PHP ${{ matrix.php }} runtime (WP 7.1.3)
    # EXPIRY 2026-12-15: temporary Ubuntu pin, see
    # docs/decisions/2026-11-06-ci-environment-repair.md.
    runs-on: ubuntu-24.04
    # Measured across 20 completed runs per PHP: max 1.8m, median 1.1m, min 0.9m.
    # 15m is ~8x the worst observed. Wide on purpose: this matrix backs three
    # REQUIRED status checks (Closure — PHP 8.1/8.3/8.4 runtime (WP 7.1.3)), so a
    # premature timeout would be a false red on a protected branch.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      STORAGE_OUT: /home/runner/closure-storage
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, xml, curl, zip
          coverage: none

      # Apt package list unchanged (`mysql-client` only) + pinned, verified WP-CLI.
      - name: Tooling (mysql-client + wp-cli)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client
          apt-log-dir: /tmp

      # Same evidence the old combined step printed, kept in its own step so the
      # PHP runtime record survives the move.
      - name: PHP runtime evidence (after tooling)
        run: |
          php -v | head -1
          php -m | grep -E 'sodium|mysqli|openssl' || true

      - name: Build release ZIP (whitelist-only)
        run: |
          bash bin/build-release.sh
          mkdir -p "$GITHUB_WORKSPACE/closure-evidence"
          cat dist/clinic-practice-management-1.0.0.zip.sha256 > "$GITHUB_WORKSPACE/closure-evidence/release-sha.txt"

      - name: Runtime probe — PHP ${{ matrix.php }} + WP 7.1.3 (fresh from ZIP)
        run: |
          set -u
          set +e
          PLUGIN="$GITHUB_WORKSPACE/clinic-practice-management"
          EVID="$GITHUB_WORKSPACE/closure-evidence"
          mkdir -p "$EVID" "$STORAGE_OUT"
          EVIDF="$EVID/runtime-php-${{ matrix.php }}.txt"
          VER=7.1.3
          WDIR="/home/runner/www-php${{ matrix.php }}"
          DB="cpms_rt${{ matrix.php }}"
          rm -rf "$WDIR" /home/runner/wordpress
          curl -fsSL "https://wordpress.org/wordpress-${VER}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /home/runner
          mv /home/runner/wordpress "$WDIR"
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE \`$DB\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd "$WDIR"
          wp config create --dbname="$DB" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG false --raw --allow-root
          wp core install --url="http://php${{ matrix.php }}.closure.test" --title="Closure PHP ${{ matrix.php }}" --admin_user=cl_admin --admin_password='Closure-2026!' --admin_email=cl@closure.test --skip-email --allow-root
          wp plugin install "$PLUGIN/dist/clinic-practice-management-1.0.0.zip" --activate --path="$WDIR" --allow-root > /tmp/wp-plugin-install.log 2>&1 || { echo 'plugin install/activate FAILED'; cat /tmp/wp-plugin-install.log; exit 1; }
          WP_HOME="$WDIR" php "$WDIR/wp-content/plugins/clinic-practice-management/bin/cpms" migrate || true

          : > "$EVIDF"
          echo "start $(date -u) php=${{ matrix.php }} wp=7.1.3" >> "$EVIDF"
          cat > /tmp/runtime-probe.php <<'PHPEOF'
          <?php
          error_reporting(E_ALL);
          $home = (string) getenv('WP_HOME');
          if (!is_file(rtrim($home, '/') . '/wp-load.php')) { fwrite(STDERR, 'WP_HOME invalid: ' . $home . "\n"); exit(3); }
          require rtrim($home, '/') . '/wp-load.php';
          use ClinicCore\Bootstrap\App;
          use ClinicCore\Domain\Licensing\LicenseSignature;
          global $wpdb;
          $pluginDir = defined('CPMS_PLUGIN_DIR') ? rtrim((string) CPMS_PLUGIN_DIR, '/') : '';
          $captured = [];
          set_error_handler(static function (int $sev, string $msg, string $file = '', int $line = 0) use (&$captured): bool {
          $captured[] = ['sev' => $sev, 'msg' => $msg, 'file' => $file, 'line' => $line];
          return false;
          });
          function uuid4(): string
          {
          $d = random_bytes(16);
          $d[6] = chr((ord($d[6]) & 0x0f) | 0x40);
          $d[8] = chr((ord($d[8]) & 0x3f) | 0x80);
          return vsprintf('%s%s-%s-%s-%s-%s%s%s', str_split(bin2hex($d), 4));
          }
          function ok(string $label, bool $cond, string $detail = ''): void
          {
          echo ($cond ? 'PASS ' : 'FAIL ') . $label . ($detail !== '' ? ' — ' . $detail : '') . "\n";
          if (!$cond) { fwrite(STDERR, 'ABORT at: ' . $label . "\n"); exit(1); }
          }
          $sto = (string) (getenv('STORAGE_OUT') ?: WP_CONTENT_DIR . '/closure-files');
          if (!is_dir($sto)) { mkdir($sto, 0750, true); }
          App::settings()->set('files.storage_path', $sto);
          ok('plugin-version', defined('CPMS_VERSION') && CPMS_VERSION === '1.0.0', defined('CPMS_VERSION') ? (string) CPMS_VERSION : '?');
          $schema = App::migrations()->currentVersion();
          ok('schema-0032', $schema === '2026_11_20_0032', (string) $schema);
          $cpmsPrefixLike = addcslashes($wpdb->prefix . 'cpms_', '_%\\');
          $tables = (int) $wpdb->get_var("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name LIKE '{$cpmsPrefixLike}%'");
          ok('cpms-tables', $tables >= 30, 'tables=' . $tables);
          $roleDoctor = get_role('cpms_doctor');
          ok('roles-registered', $roleDoctor !== null && get_role('cpms_secretary') !== null && get_role('cpms_patient') !== null);
          $meta = App::licenseService()->statusMeta();
          $installIdValid = isset($meta['install_id']) && preg_match('/^[0-9a-f]{32}$/', (string) $meta['install_id']) === 1;
          $licenseFresh = ($meta['status'] ?? '') === 'activation_pending' && ($meta['activation_window_type'] ?? '') === 'fresh';
          unset($meta['install_id'], $meta['install_id_masked']); // never publish even a partial installation identifier
          ok('license-fresh', $licenseFresh && $installIdValid, json_encode($meta));
          if (!function_exists('rest_get_server')) { require_once ABSPATH . 'wp-includes/rest-api.php'; }
          if (!did_action('rest_api_init')) { do_action('rest_api_init'); }
          $routes = rest_get_server()->get_routes();
          ok('rest-route-health', isset($routes['/clinic/v1/health']));
          $req = new WP_REST_Request('GET', '/clinic/v1/health');
          $resp = rest_do_request($req);
          $payload = $resp->get_data();
          $data = is_array($payload) ? ($payload['data'] ?? $payload) : [];
          ok('rest-health', $resp->get_status() === 200 && is_array($data) && ($data['ok'] ?? false) === true, 'http=' . $resp->get_status() . ' body=' . substr((string) wp_json_encode($payload), 0, 220));
          $nowSql = App::db()->nowUtcSql();
          ok('db-utc-clock', strtotime((string) $nowSql) !== false && abs(time() - strtotime((string) $nowSql)) < 86400, (string) $nowSql);
          $mkUser = static function (string $login, string $role): int {
          $existing = username_exists($login);
          if ($existing) { return (int) $existing; }
          $id = wp_create_user($login, 'Closure-' . bin2hex(random_bytes(8)) . '!a', $login . '@closure.test');
          if (!is_int($id) || $id <= 0) { throw new RuntimeException('user create failed: ' . $login); }
          $u = get_userdata($id);
          if ($u !== false) { $u->set_role($role); }
          return $id;
          };
          $doctorUserId = $mkUser('closure_doctor', 'cpms_doctor');
          $secretaryId = $mkUser('closure_secretary', 'cpms_secretary');
          $patientUserId = $mkUser('closure_patient', 'cpms_patient');
          $db = App::db();
          $now = $db->nowUtcSql();
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (1, %s, %d, 1, %s, %s)', 'دکتر Closure (Synthetic)', $doctorUserId, $now, $now));
          $clinicianId = (int) $wpdb->insert_id;
          // Phase 3 Slice 5 — همان قاعده: پزشکِ پروب به عضویت فعالِ Clinic نیاز
          // دارد (Capability سراسری تنها لایهٔ دفاعی است، نه Authority).
          $closureClinicId = App::scope()->clinicId;
          if (App::membership_service()->membership_for($closureClinicId, $doctorUserId) === null) {
              App::membership_service()->create_membership($closureClinicId, $doctorUserId, 'cpms_doctor');
          }
          // Phase 3 Slice 6A — عملیات مالی probe با actor منشی انجام می‌شود؛
          // مجوز Clinic-scoped از عضویت فعال می‌آید (نقش سراسری WP کافی نیست).
          if (App::membership_service()->membership_for($closureClinicId, $secretaryId) === null) {
              App::membership_service()->create_membership($closureClinicId, $secretaryId, 'cpms_secretary');
          }
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patients') . ' (clinic_id, mrn, first_name, last_name, mobile, status, created_at, updated_at) VALUES (1, %s, %s, %s, %s, %s, %s, %s)', 'SYN-CLOSURE-RT-001', 'بیمار', 'Closure (Synthetic)', '09120001234', 'active', $now, $now));
          $patientId = (int) $wpdb->insert_id;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patient_user_links') . ' (clinic_id, patient_id, wp_user_id, mobile_at_link, is_primary, linked_at) VALUES (1, %d, %d, %s, 1, %s)', $patientId, $patientUserId, '09120001234', $now));
          $loginRepo = new \ClinicCore\Infrastructure\Repository\PatientLoginRepository($db);
          $acct = $loginRepo->find_account_by_user_id($patientUserId);
          if ($acct === null) {
              $acctId = $loginRepo->insert_pending_account($patientUserId, '09120001234', 'بیمار', 'Closure (Synthetic)');
              $loginRepo->activate_account_from_pending($acctId, $patientUserId);
          } elseif ((string) ($acct['state'] ?? '') !== 'active') {
              $loginRepo->activate_account_from_pending((int) $acct['id'], $patientUserId);
          }
          $binding = $loginRepo->upsert_active_binding($patientUserId, 1, $patientId, $now);
          $proofStore = new \ClinicCore\Application\Auth\PatientSessionProofStore();
          $proofToken = WP_Session_Tokens::get_instance($patientUserId)->create(time() + \ClinicCore\Application\Auth\PatientSessionProofStore::SESSION_TTL_SECONDS);
          $proofStore->record_mobile_proof($patientUserId, '09120001234', null, $proofToken);
          $proofStore->record_binding_proof($patientUserId, 1, $patientId, (int) $binding['id'], (string) $binding['verified_at'], null, $proofToken);
          $_COOKIE[LOGGED_IN_COOKIE] = wp_generate_auth_cookie($patientUserId, time() + \ClinicCore\Application\Auth\PatientSessionProofStore::SESSION_TTL_SECONDS, 'logged_in', $proofToken);
          App::patient_session_scope()->set_in_process_session_token($patientUserId, $proofToken);
          wp_set_current_user($patientUserId);
          $slotDate = gmdate('Y-m-d', time() + 86400);
          $wpdb->query($wpdb->prepare('INSERT IGNORE INTO ' . $db->table('cpms_schedule_slots') . ' (clinic_id, location_id, clinician_id, slot_date, slot_time, duration_min, capacity, booked_count, held_count, is_open, created_at, updated_at) VALUES (1, (SELECT id FROM ' . $db->table('cpms_locations') . ' WHERE clinic_id = 1 AND is_primary = 1 LIMIT 1), %d, %s, %s, 20, 1, 0, 0, 1, %s, %s)', $clinicianId, $slotDate, '10:00', $now, $now));
          $otp = App::otpService()->request('09120001234');
          ok('otp-request', isset($otp['expires_in']));
          $hold = App::bookingService()->hold($patientUserId, $clinicianId, $slotDate, '10:00');
          ok('booking-hold', !empty($hold['hold_token']));
          $appt = App::bookingService()->confirm((string) $hold['hold_token'], $patientUserId, 'بستن Closure (Synthetic)', uuid4());
          ok('booking-confirm', ($appt['status'] ?? '') === 'confirmed', json_encode(['status' => $appt['status'] ?? null]));
          unset($_COOKIE[LOGGED_IN_COOKIE]);
          App::patient_session_scope()->reset_in_process_state();
          wp_set_current_user(0);
          $visit = App::visitService()->walkIn($secretaryId, $patientId, $clinicianId);
          ok('walk-in', ($visit['status'] ?? '') === 'waiting');
          $visitId = (int) $visit['id'];
          $v = App::visitService()->transition($doctorUserId, $visitId, 'call', ['room' => '1']);
          ok('visit-call', ($v['status'] ?? '') === 'called');
          $v = App::visitService()->transition($doctorUserId, $visitId, 'start', []);
          ok('visit-start', ($v['status'] ?? '') === 'in_consultation');
          $note = App::clinicalService()->addNote($doctorUserId, $visitId, ['category' => 'chief_complaint', 'visibility' => 'patient_visible', 'content_text' => 'سردرد (Synthetic closure)']);
          ok('clinical-note', isset($note['id']));
          $v = App::visitService()->transition($doctorUserId, $visitId, 'complete', []);
          ok('visit-complete', ($v['status'] ?? '') === 'consultation_completed');
          // C7-S3/S4: عملیات حساس مالی (صدور فاکتور + پرداخت) فقط زیر Clinic
          // معتبر صریح (معادل مرز REST) — resolver تک‌کلینیکیِ نصب؛ در نصب مبهم
          // fail-closed. Clinic هرگز از ردیف ویزیت/فاکتور/پرداخت گرفته نمی‌شود.
          $key = uuid4();
          App::replaceExplicitScope(App::scope());
          try {
              $inv = App::financeService()->issueInvoice($secretaryId, ['visit_id' => $visitId, 'items' => [['description' => 'ویزیت (Synthetic)', 'quantity' => 1, 'unit_price' => 250000]]]);
              $pay = App::financeService()->recordPayment($secretaryId, (int) $inv['id'], ['amount' => 250000, 'method' => 'cash'], $key);
              $replay = App::financeService()->recordPayment($secretaryId, (int) $inv['id'], ['amount' => 250000, 'method' => 'cash'], $key);
          } finally {
              App::resetScope();
          }
          ok('invoice-issue', isset($inv['id']));
          ok('payment-idempotent-replay', ($pay['payment_id'] ?? -1) === ($replay['payment_id'] ?? -2));
          App::scheduleRecurringJobs();
          App::runTick(60);
          $q = App::queueHealth();
          ok('queue-health', empty($q['stale']) && (int) $q['failed'] === 0, json_encode($q));
          App::audit()->log('CLOSURE_RUNTIME_PROBE', null, 'system', null, null, null, null, ['purpose' => 'closure-runtime']);
          App::audit()->log('CLOSURE_RUNTIME_PROBE', null, 'system', null, null, null, null, ['purpose' => 'closure-runtime']);
          $chain = App::audit()->verifyChain(100);
          ok('audit-chain-ok', ($chain['ok'] ?? false) === true, json_encode($chain));
          ok('sodium-available', LicenseSignature::available());
          $kp = sodium_crypto_sign_keypair();
          $pkB64 = base64_encode(sodium_crypto_sign_publickey($kp));
          $doc = LicenseSignature::canonicalJson(['v' => 1, 'ts' => time()]);
          $sig = sodium_crypto_sign_detached($doc, sodium_crypto_sign_secretkey($kp));
          ok('signature-validates', LicenseSignature::verify($doc, base64_encode($sig), $pkB64));
          ok('signature-tamper-fails', !LicenseSignature::verify($doc . 'x', base64_encode($sig), $pkB64));
          $vault = App::vault();
          $sealed = $vault->encrypt('synthetic-secret');
          ok('vault-roundtrip', $vault->decrypt($sealed) === 'synthetic-secret');
          $rel = App::localFileStorage()->store('closure-sentinel-' . time(), 1, 'txt');
          $abs = App::localFileStorage()->absolutePath((string) $rel);
          ok('storage-write-read', $abs !== null && is_file((string) $abs) && @file_get_contents((string) $abs) !== false, (string) $abs);
          $bk = App::backupService()->createBackup('closure-runtime');
          ok('backup-create', !empty($bk['backup_id']));
          $bv = App::backupService()->verifyBackup((string) $bk['backup_id']);
          ok('backup-verify-ok', ($bv['ok'] ?? false) === true, implode('; ', (array) ($bv['errors'] ?? [])));
          restore_error_handler();
          $sevNames = [E_WARNING => 'E_WARNING', E_NOTICE => 'E_NOTICE', E_DEPRECATED => 'E_DEPRECATED', E_USER_DEPRECATED => 'E_USER_DEPRECATED', E_STRICT => 'E_STRICT', E_RECOVERABLE_ERROR => 'E_RECOVERABLE_ERROR'];
          $bad = [];
          $coreInfo = 0;
          foreach ($captured as $c) {
          if (!isset($sevNames[(int) $c['sev']])) { continue; }
          $file = (string) $c['file'];
          if ($pluginDir !== '' && str_starts_with($file, $pluginDir)) {
          $bad[] = $sevNames[(int) $c['sev']] . ' ' . $c['msg'] . ' @ ' . basename($file) . ':' . $c['line'];
          } else {
          $coreInfo++;
          }
          }
          foreach ($bad as $b) { echo "FAIL plugin-$b\n"; }
          ok('no-plugin-deprecation-warning', $bad === [], implode(' | ', $bad));
          echo "INFO core-level php diagnostics during probe: {$coreInfo}\n";
          echo "PROBE OK\n";
          PHPEOF
          php -l /tmp/runtime-probe.php >> "$EVIDF" 2>&1 || echo "php-l rc=$?" >> "$EVIDF"
          WP_HOME="$WDIR" STORAGE_OUT="$STORAGE_OUT" php /tmp/runtime-probe.php > "/tmp/probe-php${{ matrix.php }}.log" 2>&1
          RC=$?
          cp "/tmp/probe-php${{ matrix.php }}.log" "$EVIDF"
          {
            echo '=== probe (PHP ${{ matrix.php }} + WP 7.1.3) — tail ==='
            tail -n 60 "/tmp/probe-php${{ matrix.php }}.log"
            if [ "$RC" -eq 0 ] && grep -q '^PROBE OK' "/tmp/probe-php${{ matrix.php }}.log"; then echo "PASS PHP ${{ matrix.php }} full runtime (WP 7.1.3)"; RC=0; else echo "FAIL PHP ${{ matrix.php }} full runtime (rc=$RC)"; RC=1; fi
          } >> "$EVIDF"
          [ "$RC" -eq 0 ]

      - name: Post closure evidence to PR
        if: always()
        run: |
          EVIDF="$GITHUB_WORKSPACE/closure-evidence/runtime-php-${{ matrix.php }}.txt"
          {
            echo "### Closure Gate — runtime-php ${{ matrix.php }} (run ${{ github.run_id }}, ${{ github.sha }})"
            echo '```'
            if [ -f "$EVIDF" ]; then tail -n 100 "$EVIDF"; else echo '(job failed before evidence)'; fi
            echo '```'
          } > /tmp/closure-comment.md
          bash "$GITHUB_WORKSPACE/.github/scripts/post-pr-evidence.sh" /tmp/closure-comment.md "closure-runtime-php"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-evidence
          path: closure-evidence/
          retention-days: 14

  # ============================================================
  # B) RestoreApply مخرب — محیط یک‌بارمصرف (PHP 8.2 + WP 7.1.3 + MySQL 8)
  # ============================================================
  restore-apply:
    name: Closure — destructive restoreApply (isolated)
    # EXPIRY 2026-12-15: temporary Ubuntu pin, see
    # docs/decisions/2026-11-06-ci-environment-repair.md.
    runs-on: ubuntu-24.04
    # Measured across 20 completed runs: max 1.9m, median 1.1m, min 1.1m. 15m is
    # ~8x the worst observed. This job is a REQUIRED status check (Closure —
    # destructive restoreApply (isolated)) and it destroys and rebuilds state, so
    # the limit is intentionally far from the healthy path. It bounds a hang in
    # the restore drill; it must never cut a drill short.
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /home/runner/www
      STORAGE_OUT: /home/runner/closure-storage
      BACKUP_OUT: /home/runner/closure-backups
      DB_MAIN: cpms_restore_test
      CPMS_RESTORE_SUCCESS_STAGE: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, xml, curl, zip
          coverage: none

      # Apt package list unchanged (`mysql-client` only) + pinned, verified WP-CLI.
      - name: Tooling (mysql-client + wp-cli)
        uses: ./.github/actions/wp-stack-tooling
        with:
          apt-packages: mysql-client
          apt-log-dir: /tmp

      - name: Build release ZIP + WP 7.1.3 install (از آرتیفکت)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/clinic-practice-management"
          bash bin/build-release.sh
          mkdir -p "$GITHUB_WORKSPACE/closure-evidence" "$STORAGE_OUT" "$BACKUP_OUT"
          cat dist/clinic-practice-management-1.0.0.zip.sha256 > "$GITHUB_WORKSPACE/closure-evidence/release-sha.txt"
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE \`$DB_MAIN\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          rm -rf "$WP_DIR" /home/runner/wordpress
          curl -fsSL https://wordpress.org/wordpress-7.1.3.tar.gz -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /home/runner && mv /home/runner/wordpress "$WP_DIR"
          cd "$WP_DIR"
          wp config create --dbname="$DB_MAIN" --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=cpmswp_ --skip-salts --allow-root
          wp config shuffle-salts --allow-root
          wp config set WP_DEBUG false --raw --allow-root
          wp core install --url="http://restore.closure.test" --title="Restore Apply Test" --admin_user=cl_admin --admin_password='Closure-2026!' --admin_email=cl@closure.test --skip-email --allow-root
          wp plugin install "$GITHUB_WORKSPACE/clinic-practice-management/dist/clinic-practice-management-1.0.0.zip" --activate --path="$WP_DIR" --allow-root > /tmp/wp-plugin-install.log 2>&1 || { cat /tmp/wp-plugin-install.log; exit 1; }
          WP_HOME="$WP_DIR" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" migrate || true
          # storage خارج webroot + بکاپ‌ها (persisted در settings)
          cat > /tmp/configure.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          use ClinicCore\Bootstrap\App;
          App::settings()->set('files.storage_path', (string) getenv('STORAGE_OUT'));
          App::installationSettings()->setBackupStoragePath((string) getenv('BACKUP_OUT'));
          echo 'configured: files=' . App::settings()->get('files.storage_path') . " backup=" . App::settings()->get('backup.storage_path') . "\n";
          PHPEOF
          WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" BACKUP_OUT="$BACKUP_OUT" php /tmp/configure.php

      - name: Seed synthetic state A + real CPMS backup
        run: |
          set -e
          cat > /tmp/seed-a.php <<'PHPEOF'
          <?php
          require getenv('WP_HOME') . '/wp-load.php';
          use ClinicCore\Bootstrap\App;
          global $wpdb;
          $db = App::db();
          $now = $db->nowUtcSql();
          $u = get_user_by('login', 'cl_admin');
          if ($u === false) { throw new RuntimeException('admin missing'); }
          $uid = (int) $u->ID;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_clinicians') . ' (clinic_id, full_name, wp_user_id, is_active, created_at, updated_at) VALUES (1, %s, %d, 1, %s, %s)', 'دکتر Restore (Synthetic)', $uid, $now, $now));
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patients') . ' (clinic_id, mrn, first_name, last_name, mobile, status, created_at, updated_at) VALUES (1, %s, %s, %s, %s, %s, %s, %s)', 'SYN-CLOSURE-R1', 'بیمار', 'Original-LastName', '09120007777', 'active', $now, $now));
          $pid = (int) $wpdb->insert_id;
          $wpdb->query($wpdb->prepare('INSERT INTO ' . $db->table('cpms_patient_user_links') . ' (clinic_id, patient_id, wp_user_id, mobile_at_link, is_primary, linked_at) VALUES (1, %d, %d, %s, 1, %s)', $pid, $uid, '09120007777', $now));
          App::audit()->log('CLOSURE_SEED', ['wp_user_id' => $uid, 'role' => 'administrator'], 'patient', $pid, $pid, null, ['seed' => 'state-A'], ['phase' => 'closure']);
          App::audit()->log('CLOSURE_SEED', ['wp_user_id' => $uid, 'role' => 'administrator'], 'patient', $pid, $pid, null, ['seed' => 'state-A-2'], ['phase' => 'closure']);
          // D-class: valid clinical file artifact via LocalFileStorage (clinic 1)
          $rel = App::localFileStorage()->store('ORIGINAL-SENTINEL-CONTENT', 1, 'txt');
          $sto = (string) getenv('STORAGE_OUT');
          @file_put_contents('/tmp/sentinel-rel.txt', (string) $rel);
          echo json_encode(['clinician' => 1, 'patient' => $pid, 'sentinel_rel' => $rel, 'sentinel_abs' => $sto . '/' . $rel]) . "\n";
          PHPEOF
          WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" BACKUP_OUT="$BACKUP_OUT" php /tmp/seed-a.php
          echo '--- seed patient ---'
          mysql -h127.0.0.1 -P3306 -uroot -proot -N -e "SELECT id,mrn,last_name FROM \`$DB_MAIN\`.cpmswp_cpms_patients ORDER BY id;" | tee /tmp/pre-list.txt
          echo '--- backup run ---'
          WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" BACKUP_OUT="$BACKUP_OUT" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" backup run 2>&1 | tee /tmp/backup-a.log
          grep -oE 'Backup created: [0-9a-z._-]+' /tmp/backup-a.log | awk '{print $3}' > /tmp/backup-a.id
          echo "backup A id: $(cat /tmp/backup-a.id)"
          WP_HOME="$WP_DIR" STORAGE_OUT="$STORAGE_OUT" BACKUP_OUT="$BACKUP_OUT" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" backup verify "$(cat /tmp/backup-a.id)"
          echo "backup list (expect 1): $(WP_HOME="$WP_DIR" php "$WP_DIR/wp-content/plugins/clinic-practice-management/bin/cpms" backup list | wc -l)"
          [ -s /tmp/backup-a.id ] || { echo 'NO BACKUP ID'; exit 1; }

      - name: Snapshot comparator self-test
        run: |
          set -euo pipefail
          cat > /tmp/cpms-restore-snapshot.py <<'PYEOF'
          #!/usr/bin/env python3
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          from pathlib import Path

          # Guarantee: DB_MAIN plus the three watched roots only. It does not cover other
          # databases, /tmp, or external writers.
          DB = os.environ["DB_MAIN"]
          BARRIER_OPTION = "cpms_restore_barrier"
          # Empty by design: no option is excluded from the before/after comparison.
          OPTIONS_EXCLUSIONS = ()
          IDENTIFIER = re.compile(r"\A[A-Za-z0-9_$]+\Z")
          MYSQL = [
              "mysql", "-h127.0.0.1", "-P3306", "-uroot", "-proot",
              "--batch", "--skip-column-names", "--raw",
              "--default-character-set=utf8mb4",
          ]

          def quote_identifier(value):
              if IDENTIFIER.fullmatch(value) is None:
                  raise SystemExit("SNAPSHOT_UNSAFE_IDENTIFIER")
              return "`" + value + "`"

          def qualified(table):
              return quote_identifier(DB) + "." + quote_identifier(table)

          def mysql(sql):
              result = subprocess.run(MYSQL + ["-e", sql], check=False, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0:
                  sys.stderr.write(result.stderr)
                  raise SystemExit("SNAPSHOT_MYSQL_FAILED")
              return result.stdout

          def file_sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def octal_mode(path):
              return format(stat.S_IMODE(os.lstat(path).st_mode), "04o")

          def directory_snapshot(root):
              if not os.path.lexists(root):
                  return ({"exists": False, "directories": [], "files": []},
                          {".": "MISSING"})
              root_mode = os.lstat(root).st_mode
              if not stat.S_ISDIR(root_mode):
                  raise SystemExit("SNAPSHOT_ROOT_NOT_DIRECTORY")
              directories = []
              files = []
              modes = {".": format(stat.S_IMODE(root_mode), "04o")}

              def walk_error(error):
                  raise error

              for current, names, filenames in os.walk(root, topdown=True, followlinks=False,
                                                        onerror=walk_error):
                  names.sort()
                  filenames.sort()
                  relative_dir = os.path.relpath(current, root)
                  if relative_dir != ".":
                      directories.append(relative_dir.replace(os.sep, "/"))
                  for name in names:
                      path = os.path.join(current, name)
                      mode = os.lstat(path).st_mode
                      if not stat.S_ISDIR(mode):
                          raise SystemExit("SNAPSHOT_NON_DIRECTORY_ENTRY")
                      relative = os.path.relpath(path, root).replace(os.sep, "/")
                      modes[relative] = octal_mode(path)
                  for name in filenames:
                      path = os.path.join(current, name)
                      mode = os.lstat(path).st_mode
                      if not stat.S_ISREG(mode):
                          raise SystemExit("SNAPSHOT_NON_REGULAR_FILE")
                      relative = os.path.relpath(path, root).replace(os.sep, "/")
                      modes[relative] = octal_mode(path)
                      files.append({
                          "name": relative,
                          "size": os.path.getsize(path),
                          "sha256": file_sha256(path),
                      })
              return ({"exists": True, "directories": sorted(directories),
                       "files": sorted(files, key=lambda item: item["name"])}, modes)

          def exact_row_hash(table):
              columns = mysql("SHOW COLUMNS FROM " + qualified(table)).splitlines()
              names = []
              primary = []
              for line in columns:
                  fields = line.split("\t")
                  if len(fields) < 4:
                      raise SystemExit("SNAPSHOT_COLUMNS_UNAVAILABLE")
                  names.append(fields[0])
                  if fields[3] == "PRI":
                      primary.append(fields[0])
              if not names or not primary:
                  raise SystemExit("SNAPSHOT_PRIMARY_KEY_UNAVAILABLE")
              expression = "JSON_ARRAY(" + ", ".join(quote_identifier(name) for name in names) + ")"
              sql = (
                  "SELECT REPLACE(REPLACE(TO_BASE64(CAST(" + expression
                  + " AS CHAR CHARACTER SET utf8mb4)), CHAR(10), ''), CHAR(13), '') FROM "
                  + qualified(table) + " ORDER BY "
                  + ", ".join(quote_identifier(name) for name in primary)
              )
              rows = mysql(sql).splitlines()
              digest = hashlib.sha256()
              for row in rows:
                  digest.update(row.encode("ascii") + b"\n")
              return {"row_count": len(rows), "rows_sha256": digest.hexdigest()}

          def sql_literal(value):
              return "'" + value.replace("'", "''") + "'"

          def schema_snapshot():
              if IDENTIFIER.fullmatch(DB) is None:
                  raise SystemExit("SNAPSHOT_UNSAFE_DATABASE_NAME")

              # Sources: INFORMATION_SCHEMA.COLUMNS, INFORMATION_SCHEMA.STATISTICS (indexes),
              # INFORMATION_SCHEMA.VIEWS, INFORMATION_SCHEMA.TRIGGERS,
              # INFORMATION_SCHEMA.ROUTINES, INFORMATION_SCHEMA.PARAMETERS (routine signatures).
              # These catalog rows describe persistent DDL, not runtime contents.
              # Exclude STATISTICS.CARDINALITY (a cached estimate), COLUMNS.PRIVILEGES
              # (login-dependent), TRIGGERS.CREATED and ROUTINES.CREATED/LAST_ALTERED
              # (timestamps); catalog/schema identity columns are fixed by DB_MAIN.
              catalogs = {
                  "columns": (
                      "COLUMNS", "TABLE_SCHEMA",
                      ("TABLE_NAME", "COLUMN_NAME", "ORDINAL_POSITION", "COLUMN_DEFAULT",
                       "IS_NULLABLE", "DATA_TYPE", "CHARACTER_MAXIMUM_LENGTH",
                       "CHARACTER_OCTET_LENGTH", "NUMERIC_PRECISION", "NUMERIC_SCALE",
                       "DATETIME_PRECISION", "CHARACTER_SET_NAME", "COLLATION_NAME",
                       "COLUMN_TYPE", "COLUMN_KEY", "EXTRA", "COLUMN_COMMENT",
                       "GENERATION_EXPRESSION", "SRS_ID"),
                      ("TABLE_NAME", "ORDINAL_POSITION", "COLUMN_NAME"),
                  ),
                  "indexes": (
                      "STATISTICS", "TABLE_SCHEMA",
                      ("TABLE_NAME", "INDEX_NAME", "NON_UNIQUE", "SEQ_IN_INDEX",
                       "COLUMN_NAME", "EXPRESSION", "COLLATION", "SUB_PART", "NULLABLE",
                       "INDEX_TYPE", "COMMENT", "INDEX_COMMENT", "IS_VISIBLE"),
                      ("TABLE_NAME", "INDEX_NAME", "SEQ_IN_INDEX"),
                  ),
                  "views": (
                      "VIEWS", "TABLE_SCHEMA",
                      ("TABLE_NAME", "VIEW_DEFINITION", "CHECK_OPTION", "IS_UPDATABLE",
                       "DEFINER", "SECURITY_TYPE", "CHARACTER_SET_CLIENT",
                       "COLLATION_CONNECTION"),
                      ("TABLE_NAME",),
                  ),
                  "triggers": (
                      "TRIGGERS", "TRIGGER_SCHEMA",
                      ("TRIGGER_NAME", "EVENT_MANIPULATION", "EVENT_OBJECT_TABLE",
                       "ACTION_ORDER", "ACTION_STATEMENT", "ACTION_ORIENTATION",
                       "ACTION_TIMING", "SQL_MODE", "DEFINER", "CHARACTER_SET_CLIENT",
                       "COLLATION_CONNECTION", "DATABASE_COLLATION"),
                      ("TRIGGER_NAME",),
                  ),
                  "routines": (
                      "ROUTINES", "ROUTINE_SCHEMA",
                      ("SPECIFIC_NAME", "ROUTINE_NAME", "ROUTINE_TYPE", "DATA_TYPE",
                       "CHARACTER_MAXIMUM_LENGTH", "CHARACTER_OCTET_LENGTH",
                       "NUMERIC_PRECISION", "NUMERIC_SCALE", "DATETIME_PRECISION",
                       "CHARACTER_SET_NAME", "COLLATION_NAME", "DTD_IDENTIFIER",
                       "ROUTINE_BODY", "ROUTINE_DEFINITION", "EXTERNAL_LANGUAGE",
                       "PARAMETER_STYLE", "IS_DETERMINISTIC", "SQL_DATA_ACCESS", "SQL_PATH",
                       "SECURITY_TYPE", "SQL_MODE", "ROUTINE_COMMENT", "DEFINER",
                       "CHARACTER_SET_CLIENT", "COLLATION_CONNECTION", "DATABASE_COLLATION"),
                      ("SPECIFIC_NAME", "ROUTINE_TYPE"),
                  ),
                  "routine_parameters": (
                      "PARAMETERS", "SPECIFIC_SCHEMA",
                      ("SPECIFIC_NAME", "ROUTINE_TYPE", "ORDINAL_POSITION", "PARAMETER_MODE",
                       "PARAMETER_NAME", "DATA_TYPE", "CHARACTER_MAXIMUM_LENGTH",
                       "CHARACTER_OCTET_LENGTH", "NUMERIC_PRECISION", "NUMERIC_SCALE",
                       "DATETIME_PRECISION", "CHARACTER_SET_NAME", "COLLATION_NAME",
                       "DTD_IDENTIFIER"),
                      ("SPECIFIC_NAME", "ORDINAL_POSITION"),
                  ),
              }
              digest = hashlib.sha256()
              row_counts = {}
              for label, (catalog, schema_column, fields, ordering) in catalogs.items():
                  expression = (
                      "REPLACE(REPLACE(TO_BASE64(CAST(JSON_ARRAY("
                      + ", ".join(fields)
                      + ") AS CHAR CHARACTER SET utf8mb4)), CHAR(10), ''), CHAR(13), '')"
                  )
                  sql = (
                      "SELECT " + expression + " FROM INFORMATION_SCHEMA."
                      + quote_identifier(catalog) + " WHERE " + quote_identifier(schema_column)
                      + " = " + sql_literal(DB) + " ORDER BY " + ", ".join(ordering)
                  )
                  rows = mysql(sql).splitlines()
                  if label == "columns" and not rows:
                      raise SystemExit("SNAPSHOT_SCHEMA_COLUMNS_EMPTY")
                  digest.update(label.encode("ascii") + b"\\0")
                  digest.update(len(rows).to_bytes(8, "big"))
                  for row in rows:
                      encoded = row.encode("ascii")
                      digest.update(len(encoded).to_bytes(8, "big"))
                      digest.update(encoded)
                  row_counts[label] = len(rows)
              return {"sha256": digest.hexdigest(), "row_counts": row_counts}

          def snapshot():
              assert BARRIER_OPTION not in OPTIONS_EXCLUSIONS
              shown = mysql("SHOW FULL TABLES IN " + quote_identifier(DB)
                            + " WHERE Table_type = 'BASE TABLE'")
              tables = sorted(line.split("\t", 1)[0] for line in shown.splitlines() if line)
              if not tables:
                  raise SystemExit("SNAPSHOT_NO_DATABASE_TABLES")
              checksum_sql = "CHECKSUM TABLE " + ", ".join(qualified(table) for table in tables)
              checksum_rows = mysql(checksum_sql).splitlines()
              checksums = {}
              for line in checksum_rows:
                  fields = line.split("\t", 1)
                  if len(fields) != 2:
                      raise SystemExit("SNAPSHOT_CHECKSUM_SHAPE")
                  checksums[fields[0].rsplit(".", 1)[-1].strip("`")] = fields[1]
              if set(checksums) != set(tables):
                  raise SystemExit("SNAPSHOT_CHECKSUM_TABLE_SET_MISMATCH")
              count_sql = " UNION ALL ".join(
                  "SELECT '" + table + "', COUNT(*) FROM " + qualified(table)
                  for table in tables
              )
              row_counts = {}
              for line in mysql(count_sql).splitlines():
                  fields = line.split("\t", 1)
                  if len(fields) != 2:
                      raise SystemExit("SNAPSHOT_ROW_COUNT_SHAPE")
                  row_counts[fields[0]] = int(fields[1])
              if set(row_counts) != set(tables):
                  raise SystemExit("SNAPSHOT_ROW_COUNT_TABLE_SET_MISMATCH")
              table_snapshot = {
                  table: {"checksum": checksums[table], "row_count": row_counts[table]}
                  for table in tables
              }
              options_candidates = [
                  table for table in tables
                  if table.endswith("_options")
                  and table[:-len("options")] + "users" in tables
                  and table[:-len("options")] + "usermeta" in tables
              ]
              if len(options_candidates) != 1:
                  raise SystemExit("SNAPSHOT_WORDPRESS_TABLE_SET_MISMATCH")
              options_table = options_candidates[0]
              prefix = options_table[:-len("options")]
              options_rows = []
              options_sql = (
                  "SELECT HEX(option_name), IF(option_value IS NULL, 'NULL', "
                  "CONCAT('HEX:', HEX(option_value))) FROM " + qualified(options_table)
                  + " ORDER BY HEX(option_name)"
              )
              for line in mysql(options_sql).splitlines():
                  fields = line.split("\t", 1)
                  if len(fields) != 2:
                      raise SystemExit("SNAPSHOT_OPTIONS_ROW_SHAPE")
                  options_rows.append((fields[0], fields[1]))
              options_rows.sort(key=lambda item: item[0])
              options_digest = hashlib.sha256()
              for name_hex, value_hex in options_rows:
                  options_digest.update(name_hex.encode("ascii") + b"\0"
                                        + value_hex.encode("ascii") + b"\n")
              account_tables = {"users": prefix + "users", "usermeta": prefix + "usermeta"}
              account_snapshot = {}
              for label, table in account_tables.items():
                  if table not in table_snapshot:
                      raise SystemExit("SNAPSHOT_ACCOUNT_TABLE_MISSING")
                  account = exact_row_hash(table)
                  if account["row_count"] != row_counts[table]:
                      raise SystemExit("SNAPSHOT_ACCOUNT_ROW_COUNT_MISMATCH")
                  account_snapshot[label] = {"table": table, **account}
              roots = {
                  "private_storage": os.environ["STORAGE_OUT"],
                  "uploads": os.path.join(os.environ["WP_DIR"], "wp-content", "uploads"),
                  "backup_directory": os.environ["BACKUP_OUT"],
              }
              files_snapshot = {}
              modes_snapshot = {}
              for label, path in roots.items():
                  files_snapshot[label], modes_snapshot[label] = directory_snapshot(path)
              return {
                  "database": {"table_count": len(tables), "tables": table_snapshot},
                  "schema": schema_snapshot(),
                  "wp_options": {
                      "table": options_table, "row_count": len(options_rows),
                      "option_name_value_sha256": options_digest.hexdigest(),
                      "excluded_names": list(OPTIONS_EXCLUSIONS),
                  },
                  "users_usermeta": account_snapshot,
                  "files": files_snapshot,
                  "modes": modes_snapshot,
              }

          def differences(before, after):
              return [key for key in sorted(set(before) | set(after))
                      if before.get(key) != after.get(key)]

          def write_snapshot(path):
              Path(path).write_text(json.dumps(snapshot(), sort_keys=True, separators=(",", ":")) + "\n",
                                    encoding="utf-8")

          def self_test():
              before = snapshot()
              marker = Path(os.environ["STORAGE_OUT"]) / ".cpms-restore-snapshot-self-test"
              if os.path.lexists(marker):
                  raise SystemExit("SNAPSHOT_SELF_TEST_MARKER_ALREADY_EXISTS")
              try:
                  with marker.open("xb") as stream:
                      stream.write(b"temporary comparator witness\n")
                  changed = snapshot()
                  changed_sections = differences(before, changed)
                  if "files" not in changed_sections:
                      raise SystemExit("SNAPSHOT_SELF_TEST_DID_NOT_DETECT_FILE_CHANGE")
              finally:
                  if os.path.lexists(marker):
                      marker.unlink()
              reverted = snapshot()
              if differences(before, reverted):
                  raise SystemExit("SNAPSHOT_SELF_TEST_REVERT_FAILED")
              print("SNAPSHOT_SELF_TEST_DIFFERENCE_DETECTED_AND_REVERTED")

              mode_entries = before["files"]["private_storage"]["files"]
              if not mode_entries:
                  raise SystemExit("SNAPSHOT_SELF_TEST_NO_WATCHED_FILE_FOR_MODE")
              mode_path = Path(os.environ["STORAGE_OUT"]) / mode_entries[0]["name"]
              original_mode = stat.S_IMODE(os.lstat(mode_path).st_mode)
              changed_mode = original_mode ^ stat.S_IXUSR
              mode_failure = None
              try:
                  os.chmod(mode_path, changed_mode)
                  changed = snapshot()
                  if "modes" not in differences(before, changed):
                      mode_failure = "SNAPSHOT_SELF_TEST_DID_NOT_DETECT_MODE_CHANGE"
              except (SystemExit, Exception) as error:
                  mode_failure = str(error) or "SNAPSHOT_SELF_TEST_MODE_PROBE_FAILED"
              finally:
                  try:
                      if os.path.lexists(mode_path):
                          os.chmod(mode_path, original_mode)
                      else:
                          mode_failure = mode_failure or "SNAPSHOT_SELF_TEST_MODE_FILE_MISSING"
                  except (SystemExit, Exception) as error:
                      mode_failure = mode_failure or str(error) or "SNAPSHOT_SELF_TEST_MODE_RESTORE_FAILED"
              reverted = snapshot()
              reverted_sections = differences(before, reverted)
              if reverted_sections:
                  raise SystemExit("SNAPSHOT_SELF_TEST_MODE_REVERT_FAILED: "
                                   + ",".join(reverted_sections))
              if mode_failure:
                  raise SystemExit(mode_failure)
              print("SNAPSHOT_SELF_TEST_MODE_DIFFERENCE_DETECTED_AND_REVERTED")

              view_name = "cpms_restore_snapshot_self_test_view"
              existing_view = mysql(
                  "SELECT COUNT(*) FROM INFORMATION_SCHEMA.VIEWS WHERE TABLE_SCHEMA = "
                  + sql_literal(DB) + " AND TABLE_NAME = " + sql_literal(view_name)
              ).strip()
              if existing_view != "0":
                  raise SystemExit("SNAPSHOT_SELF_TEST_VIEW_ALREADY_EXISTS")
              view_created = False
              schema_failure = None
              try:
                  mysql("CREATE VIEW " + qualified(view_name)
                        + " AS SELECT 1 AS self_test_probe")
                  view_created = True
                  changed = snapshot()
                  if "schema" not in differences(before, changed):
                      schema_failure = "SNAPSHOT_SELF_TEST_DID_NOT_DETECT_SCHEMA_CHANGE"
              except (SystemExit, Exception) as error:
                  schema_failure = str(error) or "SNAPSHOT_SELF_TEST_SCHEMA_PROBE_FAILED"
              finally:
                  if view_created:
                      try:
                          mysql("DROP VIEW IF EXISTS " + qualified(view_name))
                      except (SystemExit, Exception) as error:
                          schema_failure = schema_failure or str(error) or "SNAPSHOT_SELF_TEST_VIEW_DROP_FAILED"
              reverted = snapshot()
              reverted_sections = differences(before, reverted)
              if reverted_sections:
                  raise SystemExit("SNAPSHOT_SELF_TEST_SCHEMA_REVERT_FAILED: "
                                   + ",".join(reverted_sections))
              if schema_failure:
                  raise SystemExit(schema_failure)
              print("SNAPSHOT_SELF_TEST_SCHEMA_DIFFERENCE_DETECTED_AND_REVERTED")

          if __name__ == "__main__":
              if len(sys.argv) == 2 and sys.argv[1] == "self-test":
                  self_test()
              elif len(sys.argv) == 3 and sys.argv[1] == "write":
                  write_snapshot(sys.argv[2])
                  print("SNAPSHOT_WRITTEN")
              elif len(sys.argv) == 4 and sys.argv[1] == "assert-identical":
                  before = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
                  after = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
                  changed_sections = differences(before, after)
                  if changed_sections:
                      raise SystemExit("SNAPSHOT_CHANGED: " + ",".join(changed_sections))
                  print("SNAPSHOT_IDENTICAL")
              else:
                  raise SystemExit("SNAPSHOT_USAGE")
